[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "qdgrasp"
# Single declared source: `VERSION` at the repository root.  See
# `qdgrasp/version.py` for the PEP 440 <-> SemVer mapping the release gate uses.
dynamic = ["version"]
description = "AGPL-3.0 cross-embodiment dexterous grasping library"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "QDGrasp contributors"}]
keywords = ["robotics", "dexterous-grasping", "pytorch", "mujoco"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.10.0",
  "lightning>=2.6.0",
  "numpy>=2.0.0",
  "Pillow>=12.0.0",
  "scipy>=1.14.0",
  "mujoco>=3.3.0",
  "trimesh>=4.0.0",
  "safetensors>=0.5.0",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.0",
  "einops>=0.8.0",
  "rich>=13.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "pytest-cov>=7.0.0", "ruff>=0.16.0", "mypy>=2.3.0", "types-PyYAML>=6.0.12"]
export = ["onnx>=1.20.0", "onnxruntime>=1.20.0"]
legacy = ["ultralytics>=8.4.125"]

[project.scripts]
qdgrasp = "qdgrasp.cli:main"

[project.urls]
Repository = "https://github.com/ninicom/qdgrasp"
Issues = "https://github.com/ninicom/qdgrasp/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["qdgrasp*"]
exclude = ["qdgrasp.data", "qdgrasp.data.*", "qdgrasp.nn", "qdgrasp.nn.*"]

[tool.setuptools.package-data]
qdgrasp = [
  "py.typed",
  "cfg/*.yaml",
  "presets/*.yaml",
  "presets/**/*.yaml",
  "scenes/sources/*.json",
  "assets/*",
  "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
pythonpath = ["."]
markers = [
  "corrective(finding): characterization test for one PLAN.md §9.2 finding",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.ruff]
target-version = "py311"
line-length = 120
# Trees that are deliberately not maintained source, each excluded for a reason
# the repository already states somewhere else:
#
#   evidence/, kaggle-*/  published artifacts.  ROADMAP-MVP-RELEASE-001 §0.2
#                         makes them immutable history; editing one to satisfy
#                         a linter would invalidate the thing it records.
#   qdgrasp/data/,        quarantined legacy (COR-12).  scripts/check_static_core.py
#   qdgrasp/nn/           already refuses to let the active core import them.
#   qdgrasp/utils/,       vendored upstream code, kept close to its source so it
#   qdgrasp/cfg/,         can be diffed against it.  The seven engine files are
#   7 engine files        named individually rather than by directory, because
#                         the rest of qdgrasp/engine/ is this project's own code
#                         and is expected to lint clean.
#   notebooks/            generated by scripts/build_*_notebook.py, which are
#                         themselves linted; two of these are hashed into a
#                         published review packet, so the artifact cannot be
#                         edited independently of its builder.
#
# Everything else is maintained source and is expected to lint clean.
extend-exclude = [
  "evidence",
  "notebooks",
  "kaggle-phase1",
  "kaggle-phase3",
  "kaggle-phase3-4",
  "kaggle-phase3-4-3",
  "qdgrasp/cfg",
  "qdgrasp/data",
  "qdgrasp/nn",
  "qdgrasp/utils",
  "qdgrasp/engine/exporter.py",
  "qdgrasp/engine/model.py",
  "qdgrasp/engine/predictor.py",
  "qdgrasp/engine/results.py",
  "qdgrasp/engine/trainer.py",
  "qdgrasp/engine/tuner.py",
  "qdgrasp/engine/validator.py",
]
