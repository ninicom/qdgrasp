    id: R-DOD-03
    category: original_clause
    normative_source: ROADMAP-P3.4-001#16.3
    mapped_to: [C05]
    owner: claude-implementation-agent
    status: failed
    blocker_reason: "not met, and the fourth arm shows it cannot be met by running more. Asked four independent ways -- planned recipe contacts, a ten-point mass sweep, force closure over the contacts the grasp actually made at the end of enclosure, and a purpose-built environment-assisted scene with a wall beside the target -- every one gives zero static-fail/dynamic-pass pairs. The last arm is the decisive one: it builds the textbook case for the pairing on purpose, sweeps eight declared geometries across both hands, and reports every point. Each fails both arms, never one. The reason is structural rather than a property of this corpus. Both predicates carry the same floor: certify_force_closure needs two contacts and the dynamic predicate needs min_active_fingers=2 of them sustained through the perturbation window, so a grasp too sparse for the static test is too sparse for the dynamic one by the same count. The dynamic predicate further requires floor_support_after_lift to be false, which excludes exactly the environment-supported grasps that would make a frozen force-closure test fail. Section 16.3 assumes the two can disagree in that direction; as specified they cannot. Closing this needs a change to one of the two predicates -- a static test failing on something other than contact count, such as a wrench-space margin, or a dynamic one admitting environment-supported success -- which is a contract amendment and not work this plan authorises. See evidence/phase3_4_3/s11/static-vs-dynamic.json"
